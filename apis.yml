aid: metals-dev
name: Metals.Dev
description: >-
  Metals.Dev provides a developer-friendly JSON API for spot prices of precious metals, industrial metals, and currency
  conversion rates. It offers real-time prices from leading authorities including LBMA, LME, MCX, and IBJA, plus 5+
  years of historical data.
